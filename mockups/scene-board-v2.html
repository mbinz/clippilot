<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene board v2</title>
<!-- M4 mockup v2 (feedback round 1). Static; serve with scripts/mockups/serve.ts so proxies play.
     Data: scene-board.data.js (gitignored, scripts/mockups/extract-mockup-data.ts). -->
<style>
  /* Colour system — one meaning per colour:
     neutral white = selection/focus/primary · violet = AI proposed · green = mine, confirmed
     amber = needs your decision · red = rejected / problem / destructive. Nothing else is coloured. */
  :root{
    --bg:#0e0f12; --s1:#16181d; --s2:#1d2026; --line:#272a31; --line2:#363a43;
    --text:#eceef2; --muted:#8a909c; --dim:#5d636e; --focus:#f4f5f7;
    --ai:#a78bfa; --mine:#34d399; --attn:#fbbf24; --bad:#f87171;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  button{font:inherit;color:inherit}
  .btn{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--line2)}
  .btn.primary{background:var(--focus);border-color:var(--focus);color:#0e0f12;font-weight:600}
  .btn.icon{padding:6px 9px}
  .btn.ghost{background:none;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--text)}
  .btn.danger{color:var(--bad)}
  .btn:disabled{opacity:.3;cursor:not-allowed}
  .muted{color:var(--muted)}
  .kbd{font-size:11px;color:var(--dim)}

  header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex:none}
  header h1{font-size:14px;margin:0;font-weight:600}
  .crumb{color:var(--muted);white-space:nowrap}
  .brief{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;cursor:pointer;max-width:460px;background:none}
  .brief:hover{border-color:var(--line2)}
  .brief .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .spacer{flex:1}
  .len{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .len b{color:var(--text);font-weight:600}
  .meter{width:90px;height:4px;border-radius:2px;background:var(--s2);overflow:hidden}
  .meter i{display:block;height:100%;background:var(--muted)}
  .attn-chip{color:var(--attn);border:1px solid color-mix(in srgb,var(--attn) 40%,transparent);border-radius:999px;padding:2px 10px;cursor:pointer;background:none}

  .app{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0;position:relative}
  nav{border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
  main{overflow:auto;padding:16px 22px 60px}
  .scene-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--muted)}
  .scene-item:hover{background:var(--s1);color:var(--text)}
  .scene-item.sel{background:var(--s2);color:var(--text)}
  .scene-item .n{width:16px;font-variant-numeric:tabular-nums;color:var(--dim)}
  .scene-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .scene-item .need{width:7px;height:7px;border-radius:50%;background:var(--attn)}
  .nav-tools{display:flex;gap:2px;margin-top:8px}

  .scene-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
  .scene-head h2{margin:0;font-size:18px;font-weight:600;outline:none;border-radius:4px}
  .scene-head h2:focus{box-shadow:0 0 0 1px var(--line2)}
  .scene-head .meta{color:var(--muted)}

  /* storyboard strip */
  .strip{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 14px;align-items:flex-start}
  .panel{flex:none;width:200px;cursor:pointer}
  .panel .frame{position:relative;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:#000}
  .panel .frame::after{content:'';position:absolute;inset:0;border-radius:9px;border:2px solid var(--line);pointer-events:none;z-index:3}
  .panel.ai .frame::after{border:2px dashed var(--ai)}
  .panel.mine .frame::after{border:2.5px solid var(--mine)}
  .panel.gap .frame{background:var(--s1);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
  .panel.gap .frame::after{border:2px dashed var(--line2)}
  .frame .tag,.frame .choose,.frame .dur{z-index:4}
  .panel.sel .frame{box-shadow:0 0 0 3px var(--focus)}
  .panel.drop .frame{box-shadow:0 0 0 3px var(--focus);transform:scale(1.02)}
  .frame .tag{position:absolute;top:6px;left:6px;font-size:10.5px;background:#000c;border-radius:5px;padding:0 6px;font-variant-numeric:tabular-nums}
  .frame .choose{position:absolute;top:6px;right:6px;font-size:10.5px;font-weight:700;background:var(--attn);color:#1d1400;border-radius:5px;padding:0 6px}
  .frame .dur{position:absolute;bottom:6px;right:6px;font-size:10.5px;background:#000c;border-radius:5px;padding:0 6px;font-variant-numeric:tabular-nums}
  .panel .intent{margin-top:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel:hover .intent{color:var(--text)}
  .add{flex:none;width:64px;aspect-ratio:9/12.6;border:2px dashed var(--line2);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:22px;cursor:pointer}
  .add:hover,.add.drop{color:var(--text);border-color:var(--muted)}

  /* video thumbs: poster + hover playback */
  .vt{position:absolute;inset:0;background:center/cover no-repeat}
  .vt video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .vt .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--focus);width:0}

  /* pool */
  .pool-bar{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
  .pool-bar h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:none;border:0;padding:4px 10px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--s2);color:var(--text)}
  .seg button:disabled{opacity:.3;cursor:not-allowed}
  .role{margin-bottom:14px}
  .role h4{margin:0 0 6px;font-size:11.5px;color:var(--dim);font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
  .mo{position:relative;aspect-ratio:16/9;border-radius:7px;overflow:hidden;background:#000;cursor:pointer}
  .mo:hover{box-shadow:0 0 0 2px var(--line2)}
  .mo.sel{box-shadow:0 0 0 3px var(--focus)}
  .mo .star{position:absolute;top:4px;left:6px;font-size:12px;text-shadow:0 1px 4px #000}
  .mo .use{position:absolute;bottom:5px;left:6px;width:8px;height:8px;border-radius:50%}
  .mo .warn{position:absolute;top:4px;right:6px;font-size:11px;color:var(--bad);text-shadow:0 1px 4px #000}
  .mo.filler{opacity:.55}
  .mo.rej{opacity:.35;filter:grayscale(1)}
  .more{font-size:12px;color:var(--muted);cursor:pointer;background:none;border:0;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

  /* drawer (details on demand) */
  .drawer{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--s1);border-left:1px solid var(--line2);box-shadow:-20px 0 40px #0008;transform:translateX(100%);transition:transform .18s ease;overflow:auto;padding:16px 18px 30px;z-index:10}
  .drawer.on{transform:none}
  .drawer .top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .drawer .top h3{margin:0;font-size:14px;flex:1}
  .player{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
  .player video{width:100%;height:100%;object-fit:contain;display:block}
  .player .spd{position:absolute;top:8px;right:8px;font-size:11px;background:#000c;border-radius:5px;padding:1px 7px}
  .tl{position:relative;height:26px;margin-top:10px;background:var(--s2);border-radius:6px;cursor:pointer}
  .tl .mm{position:absolute;top:4px;bottom:4px;background:var(--line2);border-radius:3px}
  .tl .mm.cur{background:var(--muted)}
  .tl .rng{position:absolute;top:0;bottom:0;border:2px solid var(--focus);border-radius:6px;background:#ffffff14}
  .tl .ph{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--focus)}
  .tl input{position:absolute;inset:0;width:100%;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
  .tl input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:14px;height:26px;cursor:ew-resize;background:transparent}
  .tl-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  .sec{margin-top:16px}
  .sec label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:6px}
  .sec textarea{width:100%;background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;font:inherit;min-height:44px;resize:vertical}
  .facts{display:flex;flex-wrap:wrap;gap:6px}
  .fact{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
  .desc{color:#cfd3db;margin:10px 0 0;font-size:12.5px}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .src{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:10px}
  .cands{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cand{cursor:pointer}
  .cand .f{position:relative;aspect-ratio:16/9;border-radius:7px;overflow:hidden;background:#000}
  .cand .f::after{content:'';position:absolute;inset:0;border-radius:7px;border:2px dashed var(--ai);pointer-events:none}
  .cand:hover .f::after{border:2px solid var(--focus)}
  .cand p{margin:4px 0 0;font-size:11px;color:var(--muted)}
  .reasons{display:none;gap:6px;flex-wrap:wrap;margin-top:8px}
  .reasons.on{display:flex}
  .reasons button{background:none;border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12px}

  /* modals */
  .modal-bg{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20}
  .modal-bg.on{display:flex}
  .modal{background:var(--s1);border:1px solid var(--line2);border-radius:14px;width:min(560px,92vw);max-height:88vh;overflow:auto;padding:20px 22px}
  .modal h3{margin:0;font-size:16px}
  .field{margin:12px 0}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:5px}
  .field input,.field textarea{width:100%;background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;font:inherit}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mh{display:flex;gap:8px;align-items:center;margin-bottom:5px}
  .mh i{width:56px;aspect-ratio:16/9;border-radius:4px;background:center/cover;flex:none}
  .mh span{flex:1;font-size:12px}
  .tag-ai{font-size:10px;font-weight:700;color:var(--ai);border:1px solid var(--ai);border-radius:5px;padding:0 6px}
  .tag-mine{font-size:10px;font-weight:700;color:var(--mine);border:1px solid var(--mine);border-radius:5px;padding:0 6px}

  .pv{width:min(1000px,94vw)}
  .screen{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
  .screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .screen .title{position:absolute;left:26px;bottom:24px;font-size:24px;font-weight:600;text-shadow:0 2px 14px #000;opacity:0;transition:opacity .5s}
  .screen .title.on{opacity:1}
  .screen .spd{position:absolute;top:12px;right:14px;font-size:12px;background:#000a;border-radius:6px;padding:1px 8px}
  .ptrack{display:flex;gap:2px;margin-top:10px;height:10px}
  .ptrack span{background:var(--s2);border-radius:2px;position:relative;overflow:hidden;cursor:pointer}
  .ptrack span i{position:absolute;inset:0;width:0;background:var(--muted)}
  .ptrack span.now i{background:var(--focus)}
  .pv-bar{display:flex;align-items:center;gap:10px;margin-top:10px}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--line2);padding:9px 14px;border-radius:10px;opacity:0;transition:opacity .2s;z-index:30;display:flex;gap:12px;align-items:center}
  .toast.on{opacity:1}
  .toast button{background:none;border:0;color:var(--focus);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<header>
  <h1>ClipPilot</h1>
  <span class="crumb">03 Arrifana › Main</span>
  <button class="brief" id="briefBtn"></button>
  <div class="spacer"></div>
  <span id="attn"></span>
  <span class="len" id="len"></span>
  <button class="btn icon" id="undo" title="Undo (⌘Z)">↶</button>
  <button class="btn icon" id="redo" title="Redo (⇧⌘Z)">↷</button>
  <button class="btn" id="pvCut">▶ Preview</button>
  <button class="btn primary" id="export">Export</button>
</header>

<div class="app">
  <nav>
    <div id="scenes"></div>
    <div class="nav-tools">
      <button class="btn ghost" id="sAdd" title="Add scene">＋</button>
      <button class="btn ghost" id="sUp" title="Move up">↑</button>
      <button class="btn ghost" id="sDown" title="Move down">↓</button>
      <button class="btn ghost" id="sDel" title="Delete scene">✕</button>
    </div>
  </nav>
  <main>
    <div class="scene-head">
      <h2 id="sName" contenteditable spellcheck="false"></h2>
      <span class="meta" id="sMeta"></span>
      <div class="spacer"></div>
      <button class="btn ghost" id="pvScene">▶ Scene</button>
    </div>
    <div class="strip" id="strip"></div>
    <div class="pool-bar">
      <h3>Moments</h3>
      <div class="seg" id="scope"><button data-v="event">This event</button><button data-v="all">All</button></div>
      <span class="kbd">Hover to play · click for details · drag onto a panel</span>
    </div>
    <div id="pool"></div>
  </main>
  <div class="drawer" id="drawer"></div>
</div>

<div class="modal-bg" id="briefModal"><div class="modal" id="briefBody"></div></div>
<div class="modal-bg" id="pvModal"><div class="modal pv" id="pvBody"></div></div>
<div class="toast" id="toast"></div>

<script src="scene-board.data.js"></script>
<script>
const D = window.DATA;
const clipById = Object.fromEntries(D.clips.map(c => [c.id, c]));
const momById = Object.fromEntries(D.moments.map(m => [m.id, m]));
const eventById = Object.fromEntries(D.events.map(e => [e.id, e]));
const evOf = m => clipById[m.clip_id].event_id;
const poster = id => D.thumbs[id] ? `url(${D.thumbs[id]})` : 'none';
const src = clipId => clipById[clipId].proxy ? `proxies/${clipById[clipId].proxy}` : '';
const fmt = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const f1 = s => s.toFixed(1) + ' s';
const $ = id => document.getElementById(id);

/* ---------------- state + undo/redo ----------------
   Everything the user can change lives in `doc`. Every action goes through act(label, fn):
   snapshot before → mutate → push to history. UI-only state (selection, scope) lives in `ui`. */
let doc = {
  brief: { state: 'proposed', target_sec: 165, audience: 'Family & grandparents',
    mood: 'Warm, sunny and playful; big Atlantic landscapes contrasted with small kid moments',
    must_have: [{ moment_id: 22, text: 'Opening: the Arrifana cliffs and bay, wide' }, { moment_id: 145, text: 'Two dolphins right next to the boat' },
      { moment_id: 128, text: 'Her excited face on the boat' }, { moment_id: 4, text: 'Giggling sticker face at the house' }, { moment_id: 62, text: 'The kiss on the beach' }],
    ending: 'Odeceixe: mum and both girls playing together in the sand, then the wide beach to close', notes: '' },
  status: {}, reason: {}, hidden: [], scenes: [],
};
const ui = { scene: 0, panel: null, moment: null, scope: 'event', filler: {}, showHidden: false };
const past = [], future = [];
function act(label, fn) {
  const before = structuredClone(doc);
  fn();
  past.push({ label, doc: before }); future.length = 0;
  render(); toast(label, true);
}
function undo() { const h = past.pop(); if (!h) return; future.push({ label: h.label, doc: structuredClone(doc) }); doc = h.doc; fixSel(); render(); toast('Undone: ' + h.label); }
function redo() { const h = future.pop(); if (!h) return; past.push({ label: h.label, doc: structuredClone(doc) }); doc = h.doc; fixSel(); render(); toast('Redone: ' + h.label); }
function fixSel() { ui.scene = Math.min(ui.scene, doc.scenes.length - 1); if (ui.panel && !panelById(ui.panel)) ui.panel = null; }

/* ---------------- draft (as Claude would apply it) ---------------- */
let pid = 1;
const P = (intent, o = {}) => ({ id: pid++, intent, source: 'ai', speed: 1, cands: [], ...o });
const fill = (intent, mid, o = {}) => {
  const m = momById[mid], sp = m.suggested_speed || 1, len = Math.min(m.end_sec - m.start_sec, 4 * sp);
  const start = +Math.max(m.start_sec, (m.start_sec + m.end_sec) / 2 - len / 2).toFixed(1);
  return P(intent, { state: 'filled', moment_id: mid, clip_id: m.clip_id, start, end: +(start + len).toFixed(1), speed: sp, ...o });
};
const cand = (intent, ids) => P(intent, { state: 'candidates', cands: ids });
const gap = intent => P(intent, { state: 'gap' });
doc.scenes = [
  { id: 1, name: 'Cliffs of Arrifana', event_id: 1, panels: [fill('Open big: the bay and the cliffs', 22), fill('Waves against the rocks', 17), fill('Family at the viewpoint', 14), cand('Wind in the hair, a tender moment', [15, 35, 16]), fill('Girls run ahead on the path', 25), fill('Through the old archway', 33)] },
  { id: 2, name: 'Beach day', event_id: 1, panels: [fill('The beach from above', 76), fill('Mum watches the little one in the waves', 47), fill('Bucket and shovel', 49), cand('Mum on the beach, laughing', [67, 55, 65]), fill('The kiss', 62, { source: 'mine' }), gap('Kids jumping into a wave')] },
  { id: 3, name: 'Dolphin trip', event_id: 2, panels: [fill('Life jacket on', 82), fill('Ready to go, smiles', 85), fill('Leaving the harbour', 102), fill('"Look, over there!"', 107), fill('Her excited face', 128, { source: 'mine' }), fill('Two dolphins alongside', 145), cand('Dolphin splash', [139, 140, 143]), fill('Kids can\'t stop laughing', 123)] },
  { id: 4, name: 'Morning at the house', event_id: 3, panels: [fill('Drawing and counting', 8), fill('Sticker face, giggling', 4, { source: 'mine' }), fill('Ice cream on the patio', 11)] },
  { id: 5, name: 'Praia do Odeceixe', event_id: 4, panels: [fill('Walking down to the beach', 151), fill('The beach, wide', 153), fill('A surfer catches a wave', 156), fill('Sisters build in the sand', 170), fill('Mum and both girls together', 177), gap('Last wide look at the sea')] },
];
doc.scenes.forEach(s => s.panels.forEach(p => { if (p.source === 'mine') doc.status[p.moment_id] = 'confirmed'; }));

/* ---------------- model helpers ---------------- */
const scene = () => doc.scenes[ui.scene];
const panelById = id => { for (const s of doc.scenes) for (const p of s.panels) if (p.id === id) return p; return null; };
const sceneOf = p => doc.scenes.find(s => s.panels.includes(p));
const firstMoment = p => p.state === 'filled' ? momById[p.moment_id] : p.state === 'candidates' ? momById[p.cands[0]] : null;
const range = p => {
  if (p.state === 'filled') return { clip: p.clip_id, a: p.start, b: p.end, sp: p.speed };
  const m = firstMoment(p); if (!m) return null;
  const sp = m.suggested_speed || 1, len = Math.min(m.end_sec - m.start_sec, 4 * sp), a = Math.max(m.start_sec, (m.start_sec + m.end_sec) / 2 - len / 2);
  return { clip: m.clip_id, a, b: a + len, sp };
};
const pLen = p => { const r = range(p); return r ? (r.b - r.a) / r.sp : 0; };
const sLen = s => s.panels.reduce((t, p) => t + pLen(p), 0);
const speedOk = (clip, sp) => sp === 1 || (sp === 0.5 && clip.fps >= 48) || (sp === 0.25 && clip.fps >= 90);
const usage = () => { const u = {}; doc.scenes.forEach(s => s.panels.forEach(p => { if (p.state === 'filled') u[p.moment_id] = p.source; })); return u; };
const isHidden = m => doc.hidden.includes(m.clip_id);

function place(p, mid) {
  const m = momById[mid], clip = clipById[m.clip_id], sp = speedOk(clip, m.suggested_speed) ? m.suggested_speed : 1;
  const len = Math.min(m.end_sec - m.start_sec, 4 * sp), a = +Math.max(m.start_sec, (m.start_sec + m.end_sec) / 2 - len / 2).toFixed(1);
  Object.assign(p, { state: 'filled', moment_id: mid, clip_id: m.clip_id, start: a, end: +(a + len).toFixed(1), speed: sp, source: 'mine', cands: [] });
  doc.status[mid] = 'confirmed';
}
function dropFromPanels(pred) {
  doc.scenes.forEach(s => s.panels.forEach(p => {
    p.cands = p.cands.filter(c => !pred(momById[c]));
    if (p.state === 'candidates' && !p.cands.length) p.state = 'gap';
    if (p.state === 'filled' && pred(momById[p.moment_id])) Object.assign(p, { state: 'gap', moment_id: null, clip_id: null, speed: 1 });
  }));
}

/* ---------------- video helpers ---------------- */
// Hover playback: muted, 2× speed, loops the range. One live <video> at a time.
let hoverV = null;
function hoverPlay(el, clipId, a, b, rate = 2) {
  stopHover();
  if (!src(clipId)) return;
  const v = document.createElement('video');
  Object.assign(v, { muted: true, playsInline: true, preload: 'auto', src: `${src(clipId)}#t=${a}` });
  v.playbackRate = rate;
  const bar = document.createElement('div'); bar.className = 'prog';
  v.addEventListener('loadedmetadata', () => { v.currentTime = a; v.playbackRate = rate; v.play().catch(() => {}); });
  v.addEventListener('timeupdate', () => { if (v.currentTime >= b) v.currentTime = a; bar.style.width = ((v.currentTime - a) / (b - a) * 100) + '%'; });
  el.append(v, bar); hoverV = { v, bar };
}
function stopHover() { if (hoverV) { hoverV.v.pause(); hoverV.v.remove(); hoverV.bar.remove(); hoverV = null; } }
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-hover]'); if (!t || t.contains(hoverV?.v)) return;
  const [c, a, b, r] = t.dataset.hover.split(',').map(Number); hoverPlay(t, c, a, b, r || 2);
});
document.addEventListener('mouseout', e => { const t = e.target.closest('[data-hover]'); if (t && !t.contains(e.relatedTarget)) stopHover(); });

/* ---------------- render ---------------- */
function render() { renderHeader(); renderNav(); renderScene(); renderPool(); renderDrawer(); }

function renderHeader() {
  const b = doc.brief;
  $('briefBtn').innerHTML = `<i class="dot" style="background:${b.state === 'confirmed' ? 'var(--mine)' : 'var(--ai)'}"></i><span class="txt">Brief · ${fmt(b.target_sec)} · ${b.audience} · ${b.mood}</span>`;
  let tot = 0, choose = 0;
  doc.scenes.forEach(s => s.panels.forEach(p => { tot += pLen(p); if (p.state === 'candidates') choose++; }));
  const over = tot > b.target_sec * 1.1;
  $('len').innerHTML = `<b style="color:${over ? 'var(--attn)' : 'var(--text)'}">${fmt(tot)}</b> / ${fmt(b.target_sec)}<span class="meter"><i style="width:${Math.min(100, tot / b.target_sec * 100)}%;background:${over ? 'var(--attn)' : 'var(--muted)'}"></i></span>`;
  $('attn').innerHTML = choose ? `<button class="attn-chip" id="nextChoose">${choose} to choose →</button>` : '';
  $('undo').disabled = !past.length; $('redo').disabled = !future.length;
  $('undo').title = past.length ? `Undo: ${past.at(-1).label} (⌘Z)` : 'Nothing to undo';
  $('redo').title = future.length ? `Redo: ${future.at(-1).label} (⇧⌘Z)` : 'Nothing to redo';
}
function renderNav() {
  $('scenes').innerHTML = doc.scenes.map((s, i) => `<div class="scene-item ${i === ui.scene ? 'sel' : ''}" data-i="${i}">
    <span class="n">${i + 1}</span><span class="name">${s.name}</span>${s.panels.some(p => p.state === 'candidates') ? '<i class="need" title="Has panels to choose"></i>' : ''}</div>`).join('');
}
function panelHTML(p, i) {
  const r = range(p);
  const cls = p.state === 'gap' ? 'gap' : p.source === 'mine' ? 'mine' : 'ai';
  let inner;
  if (p.state === 'gap') inner = `<span>empty — drop a moment</span>`;
  else {
    const m = firstMoment(p);
    inner = `<div class="vt" style="background-image:${poster(m.id)}" data-hover="${r.clip},${r.a},${r.b},${Math.max(1, 2 * r.sp)}"></div>
      ${p.state === 'candidates' ? `<span class="choose">CHOOSE · ${p.cands.length}</span>` : ''}

  }
  return `<div class="panel ${cls} ${p.id === ui.panel ? 'sel' : ''}" data-pid="${p.id}">
    <div class="frame">${inner}<span class="tag">${i + 1}</span></div><div class="intent">${p.intent}</div></div>`;
}
function renderScene() {
  const s = scene();

  $('sMeta').textContent = `${eventById[s.event_id]?.name ?? ''} · ${s.panels.length} panels · ${fmt(sLen(s))}`;
  $('strip').innerHTML = s.panels.map(panelHTML).join('') + `<div class="add" id="addPanel" title="Add panel (or drop a moment here)">＋</div>`;
}
const ROLES = ['establishing', 'action', 'reaction', 'detail', 'transition'];
const TR = { hero: 0, solid: 1, filler: 2 };
function moHTML(m, used) {
  const rej = doc.status[m.id] === 'rejected';
  return `<div class="mo ${m.tier === 'filler' ? 'filler' : ''} ${rej || isHidden(m) ? 'rej' : ''} ${ui.moment === m.id ? 'sel' : ''}" draggable="${!rej && !isHidden(m)}" data-mid="${m.id}">
    <div class="vt" style="background-image:${poster(m.id)}" data-hover="${m.clip_id},${m.start_sec},${m.end_sec},2"></div>
    ${m.tier === 'hero' ? '<span class="star" title="hero">★</span>' : ''}
    ${(m.issues || []).length ? `<span class="warn" title="${m.issues.join(', ')}">⚠</span>` : ''}
    ${used ? `<i class="use" style="background:${used === 'mine' ? 'var(--mine)' : 'var(--ai)'}" title="In the cut"></i>` : ''}</div>`;
}
function renderPool() {
  const s = scene(), used = usage();
  document.querySelectorAll('#scope button').forEach(b => b.classList.toggle('on', b.dataset.v === ui.scope));
  const all = D.moments.filter(m => ui.scope === 'all' || evOf(m) === s.event_id);
  const vis = all.filter(m => !isHidden(m) && doc.status[m.id] !== 'rejected'), hid = all.filter(m => isHidden(m) || doc.status[m.id] === 'rejected');
  let h = '';
  for (const r of ROLES) {
    const ms = vis.filter(m => m.role === r).sort((a, b) => TR[a.tier] - TR[b.tier] || a.clip_id - b.clip_id); if (!ms.length) continue;
    const main = ms.filter(m => m.tier !== 'filler'), fil = ms.filter(m => m.tier === 'filler');
    h += `<div class="role"><h4>${r[0].toUpperCase() + r.slice(1)} · ${ms.length}</h4><div class="grid">${main.concat(ui.filler[r] ? fil : []).map(m => moHTML(m, used[m.id])).join('')}</div>
      ${fil.length ? `<button class="more" data-fil="${r}">${ui.filler[r] ? 'hide' : 'show'} ${fil.length} filler</button>` : ''}</div>`;
  }
  if (hid.length) h += `<button class="more" id="tHid">${ui.showHidden ? 'hide' : 'show'} rejected / hidden · ${hid.length}</button>${ui.showHidden ? `<div class="grid" style="margin-top:8px">${hid.map(m => moHTML(m, used[m.id])).join('')}</div>` : ''}`;
  $('pool').innerHTML = h;
}

/* drawer: panel details or moment details — only when something is clicked */
let drawerV = null;
function renderDrawer() {
  const d = $('drawer'); const p = ui.panel && panelById(ui.panel); const m = !p && ui.moment && momById[ui.moment];
  if (!p && !m) { d.classList.remove('on'); drawerV?.pause(); return; }
  d.classList.add('on');
  if (p) return panelDrawer(d, p);
  momentDrawer(d, m);
}
function playerHTML(clipId, sp) { return `<div class="player"><video id="dv" muted playsinline preload="auto" src="${src(clipId)}"></video>${sp && sp !== 1 ? `<span class="spd">🐢 ${sp * 100} %</span>` : ''}</div>`; }
function wirePlayer(a, b, rate, whole) {
  const v = $('dv'); drawerV = v; if (!v) return;
  const ph = document.querySelector('#tl .ph'); const L = v.duration || 1;
  v.addEventListener('loadedmetadata', () => { v.currentTime = whole ? 0 : a; v.playbackRate = rate; v.play().catch(() => {}); });
  v.addEventListener('timeupdate', () => {
    if (!whole && (v.currentTime >= b || v.currentTime < a - 0.3)) v.currentTime = a;
    if (ph) ph.style.left = (v.currentTime / v.duration * 100) + '%';
  });
  v.addEventListener('ended', () => { v.currentTime = whole ? 0 : a; v.play(); });
  v.addEventListener('click', () => v.paused ? v.play() : v.pause());
}
function timeline(clip, curMoment, rng) {
  const L = clip.duration_sec, ms = D.moments.filter(x => x.clip_id === clip.id);
  return `<div class="tl" id="tl">${ms.map(x => `<i class="mm ${x.id === curMoment ? 'cur' : ''}" style="left:${x.start_sec / L * 100}%;width:${(x.end_sec - x.start_sec) / L * 100}%" title="${x.tier}: ${x.description.replace(/"/g, '')}"></i>`).join('')}
    ${rng ? `<div class="rng" style="left:${rng.a / L * 100}%;width:${(rng.b - rng.a) / L * 100}%"></div>
      <input type="range" id="tIn" min="0" max="${L}" step="0.1" value="${rng.a}"><input type="range" id="tOut" min="0" max="${L}" step="0.1" value="${rng.b}">` : ''}
    <i class="ph"></i></div>`;
}
function panelDrawer(d, p) {
  const s = sceneOf(p), i = s.panels.indexOf(p);
  let body = '';
  if (p.state === 'filled') {
    const clip = clipById[p.clip_id], m = momById[p.moment_id];
    body = `${playerHTML(p.clip_id, p.speed)}${timeline(clip, p.moment_id, { a: p.start, b: p.end })}
      <div class="tl-lbl"><span>in ${f1(p.start)}</span><span id="tlMid">${f1(p.end - p.start)} → ${f1(pLen(p))} on the timeline</span><span>out ${f1(p.end)}</span></div>
      <div class="src">${p.source === 'mine' ? '<span class="tag-mine">YOURS</span> confirmed' : '<span class="tag-ai">AI</span> proposed — trimming, speed or placing makes it yours'}</div>
      <p class="desc">${m.description}</p>
      <div class="sec"><label>Speed · clip is ${clip.fps} fps</label><div class="seg" id="speed">${[1, .5, .25].map(v => `<button data-sp="${v}" class="${p.speed === v ? 'on' : ''}" ${speedOk(clip, v) ? '' : 'disabled title="Footage has too few frames"'}>${v * 100} %</button>`).join('')}</div></div>`;
  } else if (p.state === 'candidates') {
    body = `<p class="muted" style="margin:0 0 10px">Pick one. If you don't, the first one is used on export.</p>
      <div class="cands">${p.cands.map((c, k) => { const m = momById[c]; return `<div class="cand" data-pick="${c}"><div class="f"><div class="vt" style="background-image:${poster(c)}" data-hover="${m.clip_id},${m.start_sec},${m.end_sec},2"></div></div><p>${k === 0 ? 'default · ' : ''}${m.tier} · ${f1(m.end_sec - m.start_sec)}</p></div>`; }).join('')}</div>
      <p class="kbd" style="margin-top:8px">Hover to play, click to use it.</p>`;
  } else {
    body = `<p class="muted" style="margin:0">Nothing placed yet. Drag a moment from the pool onto this panel. Gaps are skipped on export.</p>`;
  }
  d.innerHTML = `<div class="top"><h3>Panel ${i + 1} · ${s.name}</h3><button class="btn ghost" id="dClose" title="Close (Esc)">✕</button></div>
    ${body}
    <div class="sec"><label>Intent</label><textarea id="intent">${p.intent}</textarea></div>
    <div class="sec row"><button class="btn" id="pL" ${i === 0 ? 'disabled' : ''}>← Move</button><button class="btn" id="pR" ${i === s.panels.length - 1 ? 'disabled' : ''}>Move →</button><div class="spacer"></div><button class="btn danger" id="pDel">Delete panel</button></div>`;
  if (p.state === 'filled') wirePlayer(p.start, p.end, p.speed, false);
}
function momentDrawer(d, m) {
  const clip = clipById[m.clip_id], rej = doc.status[m.id] === 'rejected', hidden = isHidden(m);
  const t0 = ui.panelTarget && panelById(ui.panelTarget), target = t0 && t0.state !== 'filled' ? t0 : null;
  d.innerHTML = `<div class="top"><h3>${m.tier === 'hero' ? '★ ' : ''}${clip.file}</h3><button class="btn ghost" id="mWhole">Whole clip</button><button class="btn ghost" id="dClose" title="Close (Esc)">✕</button></div>
    ${playerHTML(m.clip_id)}${timeline(clip, m.id)}
    <div class="tl-lbl"><span>${f1(m.start_sec)}</span><span>moment ${f1(m.end_sec - m.start_sec)} of ${f1(clip.duration_sec)}</span><span>${f1(m.end_sec)}</span></div>
    <p class="desc">${m.description}</p>
    <div class="facts" style="margin-top:10px"><span class="fact">${m.tier}</span><span class="fact">${m.shot}</span><span class="fact">${m.role}</span>
      ${m.slowmo !== 'none' ? `<span class="fact">🐢 ${clip.fps >= 48 ? 'slow-mo ok' : 'slow-mo wanted, only ' + clip.fps + ' fps'}</span>` : ''}
      ${m.audio_keep ? `<span class="fact">🔊 ${m.audio_type}</span>` : ''}${(m.issues || []).map(x => `<span class="fact" style="color:var(--bad)">⚠ ${x}</span>`).join('')}</div>
    ${m.slowmo_reason ? `<p class="kbd" style="margin-top:6px">${m.slowmo_reason}</p>` : ''}
    <div class="sec row">
      ${rej || hidden ? `<button class="btn" id="mRestore">${rej ? 'Undo 👎' : 'Unhide clip'}</button>` : `
      <button class="btn primary" id="mPlace">${target ? `Place in panel ${sceneOf(target).panels.indexOf(target) + 1}` : `Add to “${scene().name}”`}</button>
      <button class="btn" id="mRej">👎</button><button class="btn" id="mHide">Hide clip</button>`}</div>
    <div class="reasons" id="reasons">${['shake', 'blur', 'boring', 'duplicate', 'bad timing', 'other'].map(r => `<button data-r="${r}">${r}</button>`).join('')}</div>`;
  wirePlayer(m.start_sec, m.end_sec, 1, false);
}

/* ---------------- interactions ---------------- */
$('scenes').onclick = e => { const it = e.target.closest('.scene-item'); if (it) { ui.scene = +it.dataset.i; ui.panel = ui.moment = null; render(); } };
$('sName').addEventListener('blur', e => { const v = e.target.textContent.trim(); if (v && v !== scene().name) act(`Rename scene to “${v}”`, () => { scene().name = v; }); });

$('sAdd').onclick = () => act('Add scene', () => { doc.scenes.splice(ui.scene + 1, 0, { id: Date.now(), name: 'New scene', event_id: scene().event_id, panels: [gap('Describe the shot')] }); ui.scene++; });
$('sUp').onclick = () => { const i = ui.scene; if (i > 0) act('Move scene up', () => { [doc.scenes[i - 1], doc.scenes[i]] = [doc.scenes[i], doc.scenes[i - 1]]; ui.scene--; }); };
$('sDown').onclick = () => { const i = ui.scene; if (i < doc.scenes.length - 1) act('Move scene down', () => { [doc.scenes[i + 1], doc.scenes[i]] = [doc.scenes[i], doc.scenes[i + 1]]; ui.scene++; }); };
$('sDel').onclick = () => { if (doc.scenes.length > 1) act(`Delete scene “${scene().name}”`, () => { doc.scenes.splice(ui.scene, 1); ui.scene = Math.max(0, ui.scene - 1); ui.panel = null; }); };

$('strip').onclick = e => {
  if (e.target.closest('#addPanel')) return act('Add panel', () => { const p = gap('New shot'); scene().panels.push(p); ui.panel = p.id; ui.moment = null; });
  const pe = e.target.closest('.panel'); if (!pe) return;
  const id = +pe.dataset.pid; ui.panel = ui.panel === id ? null : id; ui.panelTarget = ui.panel; ui.moment = null; render();
};
$('strip').addEventListener('dragover', e => { const t = e.target.closest('.panel,.add'); if (t) { e.preventDefault(); document.querySelectorAll('.drop').forEach(x => x !== t && x.classList.remove('drop')); t.classList.add('drop'); } });
$('strip').addEventListener('dragleave', e => { const t = e.target.closest('.panel,.add'); if (t && !t.contains(e.relatedTarget)) t.classList.remove('drop'); });
$('strip').addEventListener('drop', e => {
  e.preventDefault(); const mid = +e.dataTransfer.getData('text/plain'); const t = e.target.closest('.panel,.add'); if (!mid || !t) return;
  if (t.classList.contains('add')) act('Add moment as new panel', () => { const p = P(momById[mid].description.split(/[,.]/)[0]); scene().panels.push(p); place(p, mid); ui.panel = p.id; });
  else { const p = panelById(+t.dataset.pid); act(`Place moment in panel ${sceneOf(p).panels.indexOf(p) + 1}`, () => { place(p, mid); ui.panel = p.id; }); }
});

$('pool').addEventListener('dragstart', e => { const m = e.target.closest('.mo'); if (m) { stopHover(); e.dataTransfer.setData('text/plain', m.dataset.mid); } });
$('pool').onclick = e => {
  if (e.target.dataset.fil) { const r = e.target.dataset.fil; ui.filler[r] = !ui.filler[r]; return renderPool(); }
  if (e.target.id === 'tHid') { ui.showHidden = !ui.showHidden; return renderPool(); }
  const mo = e.target.closest('.mo'); if (!mo) return;
  // remember a selected empty/candidate panel as the place target while showing the moment
  if (ui.panel) ui.panelTarget = ui.panel;

};
$('scope').onclick = e => { if (e.target.dataset.v) { ui.scope = e.target.dataset.v; renderPool(); } };

const drawer = $('drawer');
drawer.addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'dClose') { ui.panel = ui.moment = null; return render(); }
  const p = ui.panel && panelById(ui.panel);
  if (p) {
    const s = sceneOf(p), i = s.panels.indexOf(p);
    if (t.dataset.sp && !t.disabled) act(`Speed ${+t.dataset.sp * 100} %`, () => { p.speed = +t.dataset.sp; p.source = 'mine'; doc.status[p.moment_id] = 'confirmed'; });
    const pk = t.closest('[data-pick]'); if (pk) act('Choose candidate', () => place(p, +pk.dataset.pick));
    if (t.id === 'pL') act('Move panel', () => { [s.panels[i - 1], s.panels[i]] = [s.panels[i], s.panels[i - 1]]; });
    if (t.id === 'pR') act('Move panel', () => { [s.panels[i + 1], s.panels[i]] = [s.panels[i], s.panels[i + 1]]; });
    if (t.id === 'pDel') act(`Delete panel ${i + 1}`, () => { s.panels.splice(i, 1); ui.panel = null; });
    return;
  }
  const m = ui.moment && momById[ui.moment]; if (!m) return;

    const target = ui.panelTarget && panelById(ui.panelTarget);
    if (target && target.state !== 'filled') act(`Place moment in panel ${sceneOf(target).panels.indexOf(target) + 1}`, () => { place(target, m.id); ui.panel = target.id; ui.moment = null; });
    else act(`Add moment to “${scene().name}”`, () => { const np = P(m.description.split(/[,.]/)[0]); scene().panels.push(np); place(np, m.id); ui.panel = np.id; ui.moment = null; });
  }
  if (t.id === 'mRej') $('reasons').classList.toggle('on');
  if (t.dataset.r) act(`👎 ${t.dataset.r}`, () => { doc.status[m.id] = 'rejected'; doc.reason[m.id] = t.dataset.r; dropFromPanels(x => x.id === m.id); ui.moment = null; });
  if (t.id === 'mHide') act(`Hide clip ${clipById[m.clip_id].file}`, () => { doc.hidden.push(m.clip_id); dropFromPanels(x => x.clip_id === m.clip_id); ui.moment = null; });
  if (t.id === 'mRestore') act(doc.status[m.id] === 'rejected' ? 'Undo 👎' : 'Unhide clip', () => { if (doc.status[m.id] === 'rejected') delete doc.status[m.id]; doc.hidden = doc.hidden.filter(c => c !== m.clip_id); });
});
// trim: live preview while dragging, one undo step on release

/* ---------------- preview: real proxy playback, in order ---------------- */
let pv = null;
function preview(items) {
  stopHover(); drawerV?.pause();
  const seq = items.filter(x => range(x.p));
  $('pvBody').innerHTML = `<div class="screen"><video id="pvA" playsinline preload="auto"></video><div class="title" id="pvT"></div><span class="spd" id="pvS"></span></div>
    <div class="ptrack">${seq.map((x, k) => `<span data-k="${k}" style="flex:${pLen(x.p)}" title="${x.s.name} · ${x.p.intent}"><i></i></span>`).join('')}</div>
    <div class="pv-bar"><button class="btn" id="pvPlay">⏸</button><span class="muted" id="pvInfo"></span><div class="spacer"></div>
      <div class="seg" id="pvRate"><button data-r="1" class="on">1×</button><button data-r="2">2×</button></div><span class="kbd">Gaps skipped · candidates play their default · Esc closes</span></div>`;
  $('pvModal').classList.add('on');
  const v = $('pvA'), bars = [...document.querySelectorAll('.ptrack span')];
  pv = { v, k: 0, rate: 1, lastScene: null };
  const go = k => {
    if (k >= seq.length) { v.pause(); $('pvInfo').textContent = 'End'; return; }
    pv.k = k; const { s, p } = seq[k], r = range(p);
    bars.forEach((b, j) => { b.classList.toggle('now', j === k); b.querySelector('i').style.width = j < k ? '100%' : '0'; });
    $('pvInfo').textContent = `${s.name} · ${p.intent}`; $('pvS').textContent = r.sp !== 1 ? `🐢 ${r.sp * 100} %` : '';
    if (s !== pv.lastScene) { $('pvT').textContent = s.name; $('pvT').classList.add('on'); setTimeout(() => $('pvT')?.classList.remove('on'), 1800); pv.lastScene = s; }
    const start = () => { v.currentTime = r.a; v.playbackRate = r.sp * pv.rate; v.play().catch(() => {}); };
    const want = new URL(src(r.clip), location.href).href;
    if (v.src !== want) { v.src = want; v.onloadedmetadata = start; } else start();
    v.ontimeupdate = () => { const pr = (v.currentTime - r.a) / (r.b - r.a); bars[k].querySelector('i').style.width = Math.min(100, pr * 100) + '%'; if (v.currentTime >= r.b) go(k + 1); };
  };
  pv.go = go; go(0);
}
$('pvBody').onclick = e => {
  if (!pv) return;
  const k = e.target.closest('[data-k]'); if (k) pv.go(+k.dataset.k);
  if (e.target.id === 'pvPlay') { pv.v.paused ? pv.v.play() : pv.v.pause(); e.target.textContent = pv.v.paused ? '▶' : '⏸'; }
  if (e.target.dataset.r) { pv.rate = +e.target.dataset.r; document.querySelectorAll('#pvRate button').forEach(b => b.classList.toggle('on', b === e.target)); pv.go(pv.k); }
};
function closePv() { if (pv) { pv.v.pause(); pv.v.removeAttribute('src'); pv = null; } $('pvModal').classList.remove('on'); }
$('pvCut').onclick = () => preview(doc.scenes.flatMap(s => s.panels.map(p => ({ s, p }))));
$('pvScene').onclick = () => preview(scene().panels.map(p => ({ s: scene(), p })));
$('export').onclick = () => { let n = 0, g = 0; doc.scenes.forEach(s => s.panels.forEach(p => p.state === 'gap' ? g++ : n++)); toast(`Would write “03 Arrifana – Main.otio”: ${n} clips, ${doc.scenes.length} scene markers, ${g} gaps skipped`); };

/* ---------------- keyboard, modals, toast ---------------- */
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if (e.key === 'Escape') { if ($('pvModal').classList.contains('on')) closePv(); else if ($('briefModal').classList.contains('on')) $('briefModal').classList.remove('on'); else { ui.panel = ui.moment = null; render(); } }
});
$('undo').onclick = undo; $('redo').onclick = redo;
document.querySelectorAll('.modal-bg').forEach(bg => bg.addEventListener('click', e => { if (e.target === bg) bg.id === 'pvModal' ? closePv() : bg.classList.remove('on'); }));
function toast(t, withUndo) {
  const el = $('toast'); el.innerHTML = `<span>${t}</span>${withUndo ? '<button id="tUndo">Undo</button>' : ''}`;
  el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3500);
  const b = $('tUndo'); if (b) b.onclick = () => { undo(); };
}
render();
</script>
</body>
</html>
